<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MayBridge storefront</title><style>body{margin:0;background:#fbf8f1;color:#173b35;font:16px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:32px 20px}article{background:#fff;border:1px solid #d9d1c2;border-radius:14px;padding:18px;margin:14px 0}button{background:#173b35;color:#fff;border:0;border-radius:999px;padding:10px 16px;font-weight:700}small{color:#6f756f}</style></head>
<body><main><p>MayBridge Care Collective</p><h1>Provider storefront</h1><p><small>This demo uses the connected account ID in the URL. Use a provider slug or internal database identifier in production.</small></p><div id="products">Loading products…</div><pre id="message"></pre></main>
<script>
const accountId=new URLSearchParams(location.search).get('accountId');const products=document.querySelector('#products');const message=document.querySelector('#message');
(async()=>{if(!/^acct_/.test(accountId||'')){products.textContent='Add ?accountId=acct_... to this URL.';return}const r=await fetch('/api/accounts/'+encodeURIComponent(accountId)+'/products');const d=await r.json();if(!r.ok){products.textContent=d.error;return}products.innerHTML=d.products.map(p=>{const price=p.default_price;const amount=price?.unit_amount?('$'+(price.unit_amount/100).toFixed(2)+' '+price.currency.toUpperCase()):'Price unavailable';return '<article><h2>'+p.name+'</h2><p>'+ (p.description||'') +'</p><p>'+amount+'</p><button data-id="'+p.id+'" data-price="'+(price?.unit_amount||0)+'">Buy now</button></article>'}).join('');document.querySelectorAll('button').forEach(b=>b.onclick=async()=>{const x=await fetch('/api/accounts/'+encodeURIComponent(accountId)+'/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:b.parentElement.querySelector('h2').textContent,unit_amount:Number(b.dataset.price),currency:'usd',application_fee_amount:500})});const d=await x.json();if(!x.ok){message.textContent=d.error;return}location.href=d.url})})().catch(e=>message.textContent=e.message);
</script></main></body></html>
